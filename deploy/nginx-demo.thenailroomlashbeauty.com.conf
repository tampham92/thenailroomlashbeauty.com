# /etc/nginx/sites-available/demo.thenailroomlashbeauty.com
#
# Install:
#   sudo cp deploy/nginx-demo.thenailroomlashbeauty.com.conf \
#        /etc/nginx/sites-available/demo.thenailroomlashbeauty.com
#   sudo ln -s /etc/nginx/sites-available/demo.thenailroomlashbeauty.com \
#              /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then add TLS with:
#   sudo certbot --nginx -d demo.thenailroomlashbeauty.com
# Certbot rewrites this file to add the listen 443 block and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name demo.thenailroomlashbeauty.com;

    # The admin accepts images up to 12 MB; nginx defaults to 1 MB and would
    # reject those uploads with 413 before they ever reach Next.js.
    client_max_body_size 15M;

    # Long uploads and the occasional slow page render.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # Build output is content-hashed and immutable.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Images migrated from WordPress, plus the logo and favicon.
    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Required for Next.js dev-style streaming and websocket upgrades.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }
}
