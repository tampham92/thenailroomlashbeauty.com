# /etc/nginx/sites-available/thenailroomlashbeauty.com
#
# Production block for the apex domain, replacing the WordPress site.
# Adjust the two upstream ports below if the app does not run on 3000.
#
#   sudo cp deploy/nginx-thenailroomlashbeauty.com.conf \
#        /etc/nginx/sites-available/thenailroomlashbeauty.com
#   sudo ln -s /etc/nginx/sites-available/thenailroomlashbeauty.com /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/<old-wordpress-site>
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d thenailroomlashbeauty.com -d www.thenailroomlashbeauty.com

# www -> apex. Pick one canonical host; SITE_URL must match it.
server {
    listen 80;
    listen [::]:80;
    server_name www.thenailroomlashbeauty.com;
    return 301 https://thenailroomlashbeauty.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name thenailroomlashbeauty.com;

    # The admin accepts images up to 12 MB; nginx defaults to 1 MB and would
    # reject those uploads with 413 before they reach Next.js.
    client_max_body_size 15M;

    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    # ---- WordPress legacy URLs ------------------------------------------
    # Media indexed by Google or linked from social posts still points at
    # /wp-content/uploads/. Map it onto the migrated files so those links and
    # their accumulated ranking survive the cutover.

    # Two files that were not renamed by the date rule.
    location = /wp-content/uploads/2025/12/thenailroomlashbeauty-logo.png {
        return 301 /images/logo.png;
    }
    location ~ ^/wp-content/uploads/\d{4}/\d{2}/cropped-thenailroomlashbeauty-favicon {
        return 301 /favicon-192.png;
    }

    # /wp-content/uploads/2026/02/foo-1024x683.jpg -> /images/2026-02-foo.jpg
    # The optional -NNNxNNN group drops WordPress's generated thumbnail sizes;
    # "-scaled" is deliberately kept, because those files were migrated too.
    location ~ ^/wp-content/uploads/(\d{4})/(\d{2})/(.+?)(-\d+x\d+)?(\.[A-Za-z0-9]+)$ {
        return 301 /images/$1-$2-$3$5;
    }

    # Rank Math's sitemaps.
    location ~ ^/(sitemap_index\.xml|[a-z]+-sitemap\.xml)$ {
        return 301 /sitemap.xml;
    }

    # Endpoints that no longer exist. 410 tells crawlers to drop them and stops
    # the constant bot traffic these attract from reaching the app.
    location ~ ^/(wp-admin|wp-login\.php|xmlrpc\.php|wp-json|wp-includes|wp-content|feed|comments/feed) {
        return 410;
    }

    # ---- static ----------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /images/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # ---- app -------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_buffering off;
    }
}
